{% extends 'base.html' %}
{% block title %}Создание пользователя{% endblock %}

{% block content %}
<div class="container mt-3">
  <h1 class="mb-4 text-center">Создание пользователя</h1>

  <form method="POST" action="{{ url_for('users_bp.add_user',
      q=q, per_page=per_page, sort_by=sort_by, sort_dir=sort_dir, page=page) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="mb-3">
      <label class="form-label">Логин</label>
      <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Роли</label>
      <div class="row">
        {% for r in roles %}
          <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" id="r{{ r.id }}" name="role_ids[]" value="{{ r.id }}">
            <label class="form-check-label" for="r{{ r.id }}">{{ r.name_full }}</label>
          </div>
        {% endfor %}
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <a href="{{ url_for('users_bp.list_users',
           q=q, per_page=per_page, sort_by=sort_by, sort_dir=sort_dir, page=page) }}"
         class="btn btn-outline-secondary">Назад</a>

      <button type="submit" class="btn btn-primary">Создать</button>
    </div>
  </form>
</div>
{% endblock %}
