<script>
function clearStationCache() {
    if (confirm('Вы уверены, что хотите очистить кэш станций? Это может временно замедлить загрузку страницы.')) {
        fetch('/generation/stations/clear_cache', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': 'bf4b56f619e64c6c0fdab8efd02dee2c98f8bc46'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Показываем уведомление об успехе
                showNotification('Кэш станций успешно очищен', 'success');
                // Перезагружаем страницу для обновления данных
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } else {
                showNotification('Ошибка при очистке кэша: ' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('Ошибка при очистке кэша:', error);
            showNotification('Ошибка при очистке кэша', 'error');
        });
    }
}

function refreshStationCache() {

        }

            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': 'bf4b56f619e64c6c0fdab8efd02dee2c98f8bc46'
            }
        })
        .then(response => response.json())
        .then(data => {
            // Скрываем индикатор загрузки
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
            
            if (data.success) {
                showNotification('Кэш станций успешно обновлен', 'success');
                // Перезагружаем страницу для обновления данных
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } else {
                showNotification('Ошибка при обновлении кэша: ' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('Ошибка при обновлении кэша:', error);
            // Скрываем индикатор загрузки
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
            showNotification('Ошибка при обновлении кэша', 'error');
        });
    }
}

function showNotification(message, type) {
    // Создаем уведомление
    const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
    const notification = document.createElement('div');
    notification.className = `alert ${alertClass} alert-dismissible fade show position-fixed`;
    notification.style.cssText = 'top: 20px; right: 20px; z-index: 10000; min-width: 300px;';
    notification.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    document.body.appendChild(notification);
    
    // Автоматически скрываем через 5 секунд
    setTimeout(() => {
        if (notification.parentNode) {
            notification.remove();
        }
    }, 5000);
}
</script>

        const instantFilters = [
            "station_type_filter",

<!-- Скрипт для сброса предыдущих значений при поиске по фильтрам в шапке таблицы -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Те же моментальные фильтры, что и выше
        const instantFilters = [
            "station_type_filter",
            "tes_type_filter",
            "tes_machine_type_filter",
            "fuel_type_filter"
        ];

        // Для моментальных фильтров обновляем URL сразу при изменении чекбокса
        document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(input => {
            if (instantFilters.includes(input.name)) {
                input.addEventListener('change', function() {
                    let params = new URLSearchParams(window.location.search);
                    let filterName = this.name;

                    // 🔹 Удаляем ВСЕ старые значения этого фильтра
                    params.delete(filterName);

                    // 🔹 Добавляем в URL только отмеченные чекбоксы
                    document.querySelectorAll(`input[name="${filterName}"]:checked`).forEach(cb => {
                        params.append(filterName, cb.value);
                    });

                    // 🔹 Перенаправляем на новый URL (без дубликатов)
                    window.location.href = window.location.pathname + "?" + params.toString();
                });
            }
        });

        // Для годовых фильтров (ввод/вывод/модерн.) применяем значения только по кнопке "Ок"
        document.querySelectorAll('.filter-apply-btn').forEach(button => {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const filterName = this.getAttribute('data-filter-name');
                if (!filterName) {
                    return;
                }

                // Текущие параметры URL
                const params = new URLSearchParams(window.location.search);

                // Удаляем все старые значения этого фильтра
                params.delete(filterName);

                // Добавляем только отмеченные значения соответствующего фильтра
                document.querySelectorAll(`input[name="${filterName}"]:checked`).forEach(cb => {
                    params.append(filterName, cb.value);
                });

                // При изменении фильтра возвращаемся на первую страницу
                params.set('page', '1');

                // Переход по новому URL
                const newUrl = window.location.pathname + "?" + params.toString();
                window.location.href = newUrl;
            });
        });

        // Кнопка "Сбросить" внутри выпадающего списка — просто снимает галочки, без перезагрузки
        document.querySelectorAll('.filter-reset-btn').forEach(button => {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const filterName = this.getAttribute('data-filter-name');
                if (!filterName) {
                    return;
                }

                // Снимаем все галочки только у соответствующего фильтра
                document.querySelectorAll(`input[name="${filterName}"]`).forEach(cb => {
                    cb.checked = false;
                });
            });
        });
    });

<!-- Скрипт для обработки экспорта на странице stations_equipment_groups -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const exportButton = document.getElementById("exportExcelFull");
    if (!exportButton) return;
    
    // Сохраняем оригинальный обработчик, чтобы переопределить его
    const form = document.getElementById("exportExcelFormFull");
    if (!form) return;
    
    // Удаляем все существующие обработчики события click
    const newButton = exportButton.cloneNode(true);
    exportButton.parentNode.replaceChild(newButton, exportButton);
    
    newButton.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // Сохраняем ссылку на кнопку
        const button = this;
        const originalText = button.innerHTML;
        
        // Визуальная индикация
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Экспорт...';
        button.disabled = true;
        
        // Формируем URL с текущими параметрами страницы
        const currentUrl = new URL(window.location.href);
        const params = new URLSearchParams(currentUrl.search);
        
        // Формируем URL для экспорта
        const exportUrl = form.action + '?' + params.toString();
        
        console.log('[EXPORT] Начало экспорта stations_equipment_groups');
        console.log('[EXPORT] URL:', exportUrl);
        
        // Используем fetch для экспорта
        fetch(exportUrl, {
            method: 'GET',
            credentials: 'same-origin'
        })
        .then(response => {
            console.log('[EXPORT] Ответ получен, статус:', response.status);
            
            if (!response.ok) {
                return response.text().then(text => {
                    console.error('[EXPORT] Ошибка сервера:', text);
                    throw new Error(`Ошибка сервера (${response.status}): ${text.substring(0, 200)}`);
                });
            }
            
            const contentType = response.headers.get('content-type');
            console.log('[EXPORT] Content-Type:', contentType);
            
            if (contentType && contentType.includes('application/vnd.openxmlformats')) {
                // Это Excel файл, скачиваем его
                return response.blob().then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const timestamp = new Date().toISOString().slice(0, 10);
                    a.download = `Группы_оборудования_электростанций_${timestamp}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    console.log('[EXPORT] Файл успешно скачан');
                });
            } else {
                // Возможно, это редирект с сообщением об ошибке
                return response.text().then(text => {
                    console.warn('[EXPORT] Неожиданный тип ответа:', contentType);
                    throw new Error('Получен неожиданный тип ответа от сервера');
                });
            }
        })
        .catch(error => {
            console.error('[EXPORT] Ошибка при экспорте:', error);
            alert('Ошибка при экспорте данных: ' + error.message + '\n\nПроверьте консоль браузера (F12) для подробностей.');
        })
        .finally(() => {
            // Возвращаем состояние кнопки
            button.innerHTML = originalText;
            button.disabled = false;
        });
    });
});
</script>

    <script>
        (function () {
            function setTopbarHeightVar() {
                const topbar = document.getElementById('appTopBar');
                const h = topbar ? (topbar.getBoundingClientRect().height || 0) : 0;
                document.documentElement.style.setProperty('--app-topbar-height', h + 'px');
            }

            function applyStickyTheadOffsets() {
                document.querySelectorAll('table').forEach(function (table) {
                    const thead = table.tHead;
                    if (!thead || !thead.rows || thead.rows.length < 2) return;
                    const row1 = thead.rows[0];
                    const h = row1.getBoundingClientRect().height || 0;
                    table.style.setProperty('--sticky-thead-row1-height', h + 'px');
                });
            }

            // Включаем горизонтальный скролл ТОЛЬКО если контент реально шире контейнера.
            // Иначе на Windows при настройке "always show scrollbars" полоса рисуется "везде".
            function updateHorizontalScrollFlags() {
                document.querySelectorAll('.page-table-scroll').forEach(function (wrapper) {
                    // Важно: внутри wrapper часто есть bootstrap `.row` с отрицательными margin'ами,
                    // из-за которых wrapper.scrollWidth становится чуть шире, хотя таблица помещается.
                    // Поэтому определяем потребность в X-скролле по реальной ширине таблиц.
                    const tables = wrapper.querySelectorAll('table');
                    let maxTableScrollW = 0;
                    tables.forEach(function (t) {
                        // scrollWidth таблицы отражает фактическую ширину контента (колонок)
                        if (t && t.scrollWidth && t.scrollWidth > maxTableScrollW) {
                            maxTableScrollW = t.scrollWidth;
                        }
                    });

                    // небольшой допуск на дробные пиксели/бордеры
                    const needsX = tables.length
                        ? ((maxTableScrollW - wrapper.clientWidth) > 1)
                        : ((wrapper.scrollWidth - wrapper.clientWidth) > 1);
                    wrapper.classList.toggle('has-x-scroll', needsX);
                });

                // Для страниц справочников/обычных таблиц, где используется bootstrap `.table-responsive`
                // (там тоже overflow-x:auto и может появляться "пустая" полоса).
                document.querySelectorAll('.table-responsive').forEach(function (el) {
                    // если таблица уже живет внутри page-table-scroll — x-скролл управляется wrapper'ом
                    if (el.closest('.page-table-scroll')) return;
                    const needsX = (el.scrollWidth - el.clientWidth) > 1;
                    el.classList.toggle('has-x-scroll', needsX);
                });
            }

            // Авто-обёртка: если внутри контейнера есть таблицы, делаем единый scroll-wrapper,
            // чтобы при прокрутке скрывалось всё над шапкой таблицы.
            function wrapTablePages() {
                document.querySelectorAll('.container-fluid.mt-2').forEach(function (container) {
                    // BODY тоже имеет class="container-fluid mt-2" — его нельзя оборачивать, иначе появляются 2 scroll-контейнера
                    if (container.tagName === 'BODY') return;
                    if (!container.querySelector('table')) return;
                    if (container.querySelector(':scope > .page-table-scroll')) return;
                    // Если страница уже вручную использует stationsTableContainer — не дублируем wrapper
                    if (container.querySelector('#stationsTableContainer')) return;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'page-table-scroll';

                    while (container.firstChild) {
                        wrapper.appendChild(container.firstChild);
                    }
                    container.appendChild(wrapper);
                });
            }

            let resizeTimer = null;
            function onLayoutChange() {
                setTopbarHeightVar();
                applyStickyTheadOffsets();
                updateHorizontalScrollFlags();
            }

            window.addEventListener('load', function () {
                wrapTablePages();
                onLayoutChange();
                // на случай, если после load подгружается что-то/меняется высота
                setTimeout(updateHorizontalScrollFlags, 50);
                setTimeout(updateHorizontalScrollFlags, 250);
            });

            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(onLayoutChange, 150);
            });
        })();
    </script>

            const modified = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1;

            // показываем прелоадер на следующий кадр, не блокируя навигацию
            requestAnimationFrame(show);

            }

            function cacheOptions(selectEl) {
                // кешируем "как есть" (нужно для стабильной работы даже если потом select меняется/оборачивается)
                selectEl._searchableOptions = Array.from(selectEl.options).map(function (o) {
                    return {
                        value: String(o.value ?? ''),
                        text: String(o.textContent ?? ''),
                        disabled: !!o.disabled
                    };
                });
            }

            function getCurrentValue(selectEl) {
                return String(selectEl.value ?? '');
            }

            // Оверлей один на страницу
            var overlay = document.createElement('div');
            // Визуально как обычный Bootstrap dropdown (без разделителей)
            // ВАЖНО: не добавляем bootstrap-класс `show` по умолчанию,
            // иначе `.dropdown-menu.show { display: block; }` делает оверлей видимым всегда.
            overlay.className = 'searchable-select-overlay dropdown-menu p-2 shadow';
            overlay.innerHTML = '' +
                '<input type="text" class="form-control form-control-sm" placeholder="Поиск...">' +
                '<div class="searchable-select-list mt-2"></div>';
            function mountOverlay() {
                if (!document.body) return;
                if (!overlay.isConnected) document.body.appendChild(overlay);
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', mountOverlay);
            } else {
                mountOverlay();
            }

            var input = overlay.querySelector('input');
            var list = overlay.querySelector('.searchable-select-list');
            var activeSelect = null;
            var outsideHandlerAttached = false;
            var highlightedIndex = -1;

            function getMatches(selectEl, term) {
                cacheOptions(selectEl);
                var t = norm(term);
                var current = getCurrentValue(selectEl);

                var res = selectEl._searchableOptions
                    .filter(function (opt) {
                        // пустой option (allowClear) в списке не показываем
                        if (opt.value === '') return false;
                        var textNorm = norm(opt.text);
                        var isMatch = !t || textNorm.indexOf(t) !== -1;
                        // текущий выбор показываем всегда
                        return isMatch || String(opt.value) === current;
                    });

                // UX: текущий выбранный — вверху (если есть)
                res.sort(function (a, b) {
                    var aSel = String(a.value) === current ? 0 : 1;
                    var bSel = String(b.value) === current ? 0 : 1;
                    if (aSel !== bSel) return aSel - bSel;
                    return norm(a.text).localeCompare(norm(b.text), 'ru', { sensitivity: 'base' });
                });

                return res;
            }

            function renderList(selectEl, term) {
                var items = getMatches(selectEl, term);
                list.innerHTML = '';

                if (!items.length) {
                    var empty = document.createElement('div');
                    empty.className = 'dropdown-item text-muted';
                    empty.textContent = 'Ничего не найдено';
                    list.appendChild(empty);
                    highlightedIndex = -1;
                    return;
                }

                var current = getCurrentValue(selectEl);
                highlightedIndex = 0;

                items.forEach(function (opt, idx) {
                    var el = document.createElement('button');
                    el.type = 'button';
                    el.className = 'dropdown-item searchable-select-item';
                    if (opt.disabled) el.classList.add('disabled', 'is-disabled');
                    // Текущее выбранное значение помечаем мягко (без "active")
                    if (String(opt.value) === current) el.classList.add('fw-semibold', 'text-primary');
                    // Подсветка текущего элемента навигации
                    if (idx === highlightedIndex) el.classList.add('active');

                    el.textContent = opt.text || '—';

                    el.dataset.value = String(opt.value);
                    el.dataset.index = String(idx);

                    el.addEventListener('mousemove', function () {
                        highlightedIndex = idx;
                        updateHighlight();
                    });

                    el.addEventListener('mousedown', function (e) {
                        // не даём событию уйти наружу, чтобы оверлей не закрылся раньше выбора
                        e.preventDefault();
                        e.stopPropagation();
                        if (opt.disabled) return;
                        selectEl.value = String(opt.value);
                        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                        closeOverlay(false);
                        selectEl.focus();
                    });

                    list.appendChild(el);
                });
            }

            function updateHighlight() {
                var children = Array.from(list.querySelectorAll('.searchable-select-item'));
                children.forEach(function (node, idx) {
                    // сбрасываем только подсветку навигации, не трогаем маркеры выбранного значения
                    node.classList.toggle('active', idx === highlightedIndex);
                });
                var active = children[highlightedIndex];
                if (active && typeof active.scrollIntoView === 'function') {
                    active.scrollIntoView({ block: 'nearest' });
                }
            }

            function positionOverlay(selectEl) {
                var r = selectEl.getBoundingClientRect();
                overlay.style.left = (r.left + window.scrollX) + 'px';
                overlay.style.top = (r.bottom + window.scrollY + 4) + 'px';
                overlay.style.width = r.width + 'px';
            }

            function openOverlay(selectEl, initialText) {
                activeSelect = selectEl;
                cacheOptions(selectEl); // обновляем кеш при каждом открытии
                positionOverlay(selectEl);
                overlay.style.display = 'block';

                if (typeof initialText === 'string' && initialText) {
                    input.value = initialText;
                } else {
                    input.value = '';
                }
                renderList(selectEl, input.value);

                // фокус на поле поиска
                setTimeout(function () {
                    input.focus();
                    input.select();
                }, 0);

                if (!outsideHandlerAttached) {
                    outsideHandlerAttached = true;
                    document.addEventListener('mousedown', onOutsideClick, true);
                    window.addEventListener('resize', onResize, true);
                    window.addEventListener('scroll', onResize, true);
                }
            }

            function closeOverlay(restoreAll) {
                if (!activeSelect) {
                    overlay.style.display = 'none';
                    return;
                }
                activeSelect = null;
                overlay.style.display = 'none';
                input.value = '';
                list.innerHTML = '';
            }

            function onOutsideClick(e) {
                if (overlay.contains(e.target)) return;
                if (activeSelect && activeSelect.contains(e.target)) return;
                closeOverlay(true);
            }

            function onResize() {
                if (activeSelect) positionOverlay(activeSelect);
            }

            // Реагируем на ввод в поле поиска
            input.addEventListener('input', function () {
                if (!activeSelect) return;
                renderList(activeSelect, input.value);
            });

            input.addEventListener('keydown', function (e) {
                if (!activeSelect) return;

                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeOverlay(false);
                    activeSelect.focus();
                    return;
                }

                if (e.key === 'ArrowDown' || e.key === 'Down') {
                    e.preventDefault();
                    var countDown = list.querySelectorAll('.searchable-select-item').length;
                    if (!countDown) return;
                    highlightedIndex = Math.min(countDown - 1, highlightedIndex + 1);
                    updateHighlight();
                    return;
                }

                if (e.key === 'ArrowUp' || e.key === 'Up') {
                    e.preventDefault();
                    var countUp = list.querySelectorAll('.searchable-select-item').length;
                    if (!countUp) return;
                    highlightedIndex = Math.max(0, highlightedIndex - 1);
                    updateHighlight();
                    return;
                }

                if (e.key === 'Enter') {
                    e.preventDefault();
                    var items = Array.from(list.querySelectorAll('.searchable-select-item'));
                    if (!items.length) return;
                    var node = items[Math.max(0, highlightedIndex)];
                    var value = node ? node.dataset.value : null;
                    if (value == null) return;
                    activeSelect.value = String(value);
                    activeSelect.dispatchEvent(new Event('change', { bubbles: true }));
                    closeOverlay(false);
                    activeSelect.focus();
                    return;
                }
            });

            // Точки применения: все select генкомпаний
            function isGenCompanySelect(el) {
                if (!el || el.tagName !== 'SELECT') return false;
                if (el.id === 'id_gen_company') return true;
                if (el.classList && el.classList.contains('gen-company-select')) return true;
                return false;
            }

            function isSelect2Enhanced(el) {
                if (!el) return false;
                // select2 прячет исходный <select>
                if (el.classList && el.classList.contains('select2-hidden-accessible')) return true;
                // на случай если jQuery/select2 есть
                var $ = window.jQuery;
                try {
                    if (typeof $ === 'function' && $.fn && $.fn.select2) {
                        return !!$(el).data('select2');
                    }
                } catch (e) {
                    // ignore
                }
                return false;
            }

            // Открываем "поиск" по клику (не по focus), чтобы после выбора не оставалось поле "Поиск..."
            document.addEventListener('mousedown', function (e) {
                var el = e.target;
                if (!isGenCompanySelect(el)) return;
                if (isSelect2Enhanced(el)) return; // если работает Select2 — не мешаем
                // не открываем нативный select, используем наш список
                e.preventDefault();
                e.stopPropagation();
                openOverlay(el, '');
            }, true);

            // Если пользователь начинает печатать, когда фокус на select — тоже открываем поиск
            document.addEventListener('keydown', function (e) {
                var el = e.target;
                if (!isGenCompanySelect(el)) return;
                if (isSelect2Enhanced(el)) return;
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (e.key.length !== 1) return; // только "печатаемые" символы
                e.preventDefault();
                openOverlay(el, e.key);
            });
        })();
    </script>

</body>
</html>
