<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРМ ГС — технические работы</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6f9;
            color: #1a2b3c;
            padding: 1.5rem;
        }
        .card {
            max-width: 32rem;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 40, 80, 0.08);
            padding: 2.5rem 2rem;
            text-align: center;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: #0d47a1;
        }
        p {
            margin: 0 0 0.75rem;
            line-height: 1.55;
            font-size: 1rem;
            color: #455a64;
        }
        .hint {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #78909c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ведутся технические работы</h1>
        <p>Приложение «АРМ ГС» временно недоступно — выполняется обновление или перезапуск сервиса.</p>
        <p>Пожалуйста, обновите страницу через несколько минут.</p>
        <p class="hint">Если сообщение не исчезает длительное время, обратитесь к администратору системы.</p>
    </div>
</body>
</html>
