{% extends 'base.html' %}

{% block title %}Пакетный пересчет топлива{% endblock %}

{% block content %}
{% if current_user.is_authenticated %}
<div class="container-fluid mt-2">

<div class="container content-start-container">
    <div class="container-fluid">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <h1 class="h3 mb-0">Пакетный пересчет топлива</h1>
            <a href="{{ url_for('fuel_bp.fuel_start') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Модуль «Топливо»
            </a>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm w-100">
                    <div class="card-body text-center">
                        <a href="{{ url_for('fuel_bp.fuel_calculation_form') }}" class="btn btn-primary fs-4 w-100 py-4">
                            Расчет
                        </a>
                        <p class="text-muted small mt-2 mb-0">Параметры распределения: этапы «Коэфф», «Распред», «Топливо»</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</div>
{% endif %}
{% endblock %}
