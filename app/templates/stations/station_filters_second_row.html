<!-- Вторая строка фильтров -->
<div class="col-12 mb-2">
    <div class="collapse mt-2" id="importExportCollapse">

        <div class="d-flex justify-content-between align-items-start w-100 flex-nowrap">

            <!-- Левая часть (импорт) -->
            <div class="d-flex align-items-center gap-2 flex-nowrap me-4">

                <!-- Импорт -->
                <form action="{{ url_for('station_bp.import_station_list_from_excel_routes') }}"
                    method="POST" enctype="multipart/form-data"
                    class="d-flex align-items-center">
                    {{ form.csrf_token }}
                    <input type="file" name="file" class="form-control me-2">
                    <button type="submit" class="btn btn-outline-danger" style="white-space: nowrap;">
                        Импорт
                    </button>
                </form>

                <!-- Подгрузка топлива -->
                <form action="{{ url_for('station_bp.import_fuel_tes_station_from_excel_routes') }}"
                    method="POST" enctype="multipart/form-data"
                    class="d-flex align-items-center">
                    {{ form.csrf_token }}
                    <input type="file" name="file" class="form-control me-2">
                    <button type="submit" class="btn btn-outline-danger" style="white-space: nowrap;">
                        Подгрузка топлива
                    </button>
                </form>

            </div>

            <!-- Правая часть (экспорт) -->
            <div class="d-flex align-items-center gap-2 flex-nowrap ms-4">

                <!-- СиПР -->
                <form method="GET" action="{{ url_for('station_bp.export_station_sipr_ees_application_2_routes') }}">
                    {{ form.csrf_token }}
                    {% for key, value in request.args.items() %}
                        <input type="hidden" name="{{ key }}" value="{{ value }}">
                    {% endfor %}
                </form>

                <!-- Всё -->
                <form id="exportExcelFormFull" method="GET" action="{{ url_for('station_bp.export_station_full_routes') }}">
                    {{ form.csrf_token }}
                    {% for key, value in request.args.items() %}
                        <input type="hidden" name="{{ key }}" value="{{ value }}">
                    {% endfor %}
                    <button type="submit" id="exportExcelFull"  class="btn btn-outline-success" style="white-space: nowrap;">
                        Выгрузка (всё)
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>
