<!-- Скрипт подключения при раскрытии блока с фильтрами-->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const collapseEl = document.getElementById("filtersCollapse");
    const buttonEl = document.getElementById("filtersToggleBtn");

    if (!collapseEl || !buttonEl) return;

    const hasActiveFilters = JSON.parse(`{{ has_active_filters | tojson }}`);

    function highlightButton() {
        buttonEl.classList.remove("btn-outline-secondary");
        buttonEl.classList.add("btn-primary", "text-white");
    }

    function resetButton() {
        buttonEl.classList.remove("btn-primary", "text-white");
        buttonEl.classList.add("btn-outline-secondary");
    }

    function loadFiltersScript() {
        if (window.stationFiltersInitialized) return;
        const script = document.createElement("script");
        script.src = "{{ url_for('static', filename='js/stations/station_filters_first_row.js') }}";
        script.onload = () => {
            if (typeof initializeStationFilters === "function") {
                initializeStationFilters();
            }
        };
        document.head.appendChild(script);
    }

    const collapse = new bootstrap.Collapse(collapseEl, {
        toggle: false  // <--- не раскрывать автоматически
    });

    // 🔹 Если есть активные фильтры — открываем и подсвечиваем
    if (hasActiveFilters) {
        collapse.show();
        highlightButton();
        loadFiltersScript();
    }

    // 🔹 При ручном открытии — подсветка и подгрузка
    collapseEl.addEventListener("show.bs.collapse", () => {
        highlightButton();
        loadFiltersScript();
    });

    // 🔹 При закрытии — убираем подсветку
    collapseEl.addEventListener("hide.bs.collapse", () => {
        resetButton();
    });
});
</script>

<!-- Скрипт для отображения строк с располагаемой мощность и ограничениями мощности -->
<script>
    $(document).ready(function() {
        // Сохраним исходный rowspan у ячеек агрегатов (где rowspan="3")
        $('.rowspan-td').each(function() {
            $(this).data('original-rowspan', $(this).attr('rowspan'));
        });

        // Сохраняем rowspan для ячеек с названием станции
        $('.station-rowspan-td').each(function() {
            let originalRowspan = parseInt($(this).attr('rowspan'), 10);
            let totalMachines = (originalRowspan - 1) / 3;
            $(this).data('total-machines', totalMachines);
        });

        // Функция обновления строк
        function updateRows() {
            let showPOgr  = $('#toggleP_Ogr').prop('checked');   // "Отображать ограничения мощности"
            let showPRasp = $('#toggleP_Rasp').prop('checked');  // "Отображать располагаемую мощность"

            // Показываем/скрываем строки p_ogr-row
            if (showPOgr) {
                $('.p-ogr-row').show();
            } else {
                $('.p-ogr-row').hide();
            }

            // Показываем/скрываем строки p_rasp-row
            if (showPRasp) {
                $('.p-rasp-row').show();
            } else {
                $('.p-rasp-row').hide();
            }

            // Количество отображаемых строк на агрегат (1..3)
            let aggregatorRows = 1 + (showPOgr ? 1 : 0) + (showPRasp ? 1 : 0);

            // Обновляем rowspan для ячейки "Всего по станции"
            $('.total-row-cell').attr('rowspan', aggregatorRows);

            // Меняем rowspan для ячеек агрегатов
            $('.rowspan-td').each(function() {
                let original = parseInt($(this).data('original-rowspan'), 10);
                $(this).attr('rowspan', aggregatorRows);
            });

            // Меняем rowspan для ячеек с названием станции
            $('.station-rowspan-td').each(function() {
                let totalMachines = parseInt($(this).data('total-machines'), 10);
                let newRowSpan = totalMachines * aggregatorRows + 1;
                $(this).attr('rowspan', newRowSpan);
            });

        }

        // Обновляем строки при загрузке страницы
        updateRows();

        // Обновляем строки при изменении чекбоксов
        $('#toggleP_Ogr, #toggleP_Rasp').on('change', function() {
            updateRows();
        });
    });
</script>

<!-- Скрипт для поиска по фильтрам в шапке таблицы -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Найдём все чекбоксы в выпадающих фильтрах
        document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', updateFilters);
        });

        function updateFilters() {
            let form = document.createElement("form");
            form.method = "GET";
            form.action = "{{ url_for('station_bp.station_list') }}";

            // Список параметров, которые НЕ нужно добавлять
            let excludeKeys = ["station_type_filter", "tes_type_filter", "tes_machine_type_filter"];

            // Jinja2 передает параметры в JSON-объекте
            let params = JSON.parse('{{ request.args.to_dict() | tojson | safe }}');

            // Добавляем другие параметры запроса (кроме исключенных)
            for (let key in params) {
                if (!excludeKeys.includes(key)) {
                    let input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = params[key];
                    form.appendChild(input);
                }
            }

            // Добавление выбранных значений в форму
            document.querySelectorAll('.dropdown-menu input[type="checkbox"]:checked').forEach(checkbox => {
                let input = document.createElement("input");
                input.type = "hidden";
                input.name = checkbox.name;
                input.value = checkbox.value;
                form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
        }
    });
</script>

<!-- Скрипт для сброса предыдущих значений при поиске по фильтрам в шапке таблицы -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', function() {
                let params = new URLSearchParams(window.location.search);
                let filterName = this.name;

                // 🔹 Удаляем ВСЕ старые значения этого фильтра
                params.delete(filterName);

                // 🔹 Добавляем в URL только отмеченные чекбоксы
                document.querySelectorAll(`input[name="${filterName}"]:checked`).forEach(cb => {
                    params.append(filterName, cb.value);
                });

                // 🔹 Перенаправляем на новый URL (без дубликатов)
                window.location.href = window.location.pathname + "?" + params.toString();
            });
        });
    });
</script>

<!-- Скрипт высоты ячеек групп и топлива по СО ЕЭС в зав-ти от отображения располагаемой мощности и ограничений мощности-->
<script>
document.addEventListener("DOMContentLoaded", function () {
    function updateFuelCellRowspans() {
        const showPOgr  = document.getElementById("toggleP_Ogr")?.checked || false;
        const showPRasp = document.getElementById("toggleP_Rasp")?.checked || false;
        const rowMultiplier = 1 + (showPOgr ? 1 : 0) + (showPRasp ? 1 : 0);

        document.querySelectorAll(".fuel-cell").forEach(cell => {
            if (!cell) return;
            const baseRowspan = parseInt(cell.getAttribute("data-base-rowspan"), 10) || 1;
            cell.setAttribute("rowspan", baseRowspan * rowMultiplier);
            cell.style.display = "table-cell";
        });
    }

    const toggleOgr = document.getElementById("toggleP_Ogr");
    const toggleRasp = document.getElementById("toggleP_Rasp");

    if (toggleOgr) {
        toggleOgr.addEventListener("change", updateFuelCellRowspans);
    }
    if (toggleRasp) {
        toggleRasp.addEventListener("change", updateFuelCellRowspans);
    }

    const fuelCells = document.querySelectorAll(".fuel-cell");
    if (fuelCells.length > 0) {
        fuelCells.forEach(cell => {
            cell.setAttribute("data-base-rowspan", cell.getAttribute("rowspan") || "1");
        });

        updateFuelCellRowspans();
    }
});
</script>
