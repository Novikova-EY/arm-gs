<!-- Одна строка с двумя кнопками управления -->
<div class="col-12 mb-2">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

        <!-- Левая группа кнопок -->
        <div class="d-flex gap-2">
            <button id="filtersToggleBtn"
                    class="btn btn-outline-secondary text-dark"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#filtersCollapse"
                    aria-expanded="false"
                    aria-controls="filtersCollapse">
                🔍 Фильтры
            </button>

            <button class="btn btn-outline-secondary text-dark" type="button"
                data-bs-toggle="collapse" data-bs-target="#importExportCollapse"
                aria-expanded="false" aria-controls="importExportCollapse">
                📁 Импорт / Экспорт
            </button>
        </div>

        <!-- Правая группа: чекбоксы и подсветка -->
        <div class="d-flex align-items-center gap-2 ms-auto">

            <!-- Чекбокс Рогр -->
            <input type="checkbox" class="btn-check" id="toggleP_Ogr" autocomplete="off">
            <label for="toggleP_Ogr" class="btn btn-outline-primary px-3 text-center" style="min-width: 80px;">
                Рогр
            </label>

            <!-- Чекбокс Ррасп -->
            <input type="checkbox" class="btn-check" id="toggleP_Rasp" autocomplete="off" checked>
            <label for="toggleP_Rasp" class="btn btn-outline-primary px-3 text-center" style="min-width: 80px;">
                Ррасп
            </label>

            <!-- Подсветка -->
            <button id="highlightChangesBtn"
                    class="btn btn-outline-secondary text-dark"
                    type="button"
                    style="min-width: 250px;">
                ✨ Подсветить изменения
            </button>

            <!-- Округление -->
            <div class="d-flex align-items-center gap-1">
                <label for="rounding_digits" class="mb-0" style="white-space: nowrap; min-width: 100px;">Округл:</label>
                <select id="rounding_digits" name="rounding_digits" class="form-select" style="min-width: 150px;">
                    <option value="0" {% if rounding_digits == 0 %}selected{% endif %}>Не округлять</option>
                    <option value="1" {% if rounding_digits == 1 %}selected{% endif %}>1 знак</option>
                    <option value="2" {% if rounding_digits == 2 %}selected{% endif %}>2 знака</option>
                    <option value="3" {% if rounding_digits == 3 %}selected{% endif %}>3 знака</option>
                    <option value="-1" {% if rounding_digits == -1 %}selected{% endif %}>Целое число</option>
                </select>
            </div>
        </div>

    </div>
</div>
