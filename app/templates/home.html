{% extends 'base.html' %}

{% block title %}Стартовая страница{% endblock %}

{% block content %}
{% if current_user.is_authenticated %}

</div>

<div class="container">
    <div class="container-fluid">
        <div class="row g-4 justify-content-center">
            <!-- Первая строка -->
            <div class="col-12 col-md-6">
                <div class="card shadow-sm w-100">
                    <div class="card-body text-center">
                        <a href="{{ url_for('station_bp.station_list') }}" class="btn btn-primary fs-4 w-100 py-4">АРМ Генерация</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card shadow-sm w-100">
                    <div class="card-body text-center">
                        <a href="#" class="btn btn-secondary fs-4 w-100 py-4 disabled">АРМ Экономика</a>
                    </div>
                </div>
            </div>

            <!-- Вторая строка -->
            <div class="col-12 col-md-6">

                    <div class="card-body text-center">

                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card shadow-sm w-100">
                    <div class="card-body text-center">
                        <a href="#" class="btn btn-secondary fs-4 w-100 py-4 disabled">АРМ Графики нагрузки</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Разделительная линия -->

    <div class="container-fluid">
        <div class="row justify-content-center">
            <!-- Справочники -->
            <div class="col-12 col-md-6">
                <div class="card shadow-sm w-100">
                    <div class="card-body text-center">
                        <a href="{{ url_for('reference_bp.reference') }}" class="btn btn-primary fs-4 w-100 py-4">Справочники</a>
                    </div>
                </div>
            </div>
        </div>

</div>
