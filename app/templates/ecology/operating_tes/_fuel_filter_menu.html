<div id="otFuelFilterMenu" class="ot-territory-filter-menu border rounded bg-body shadow p-3" hidden
     role="dialog" aria-label="Отображаемые виды топлива">
  <div class="fw-bold mb-2">Отображаемые виды топлива</div>
  <input type="search" class="form-control form-control-sm mb-2" data-fuel-search
         placeholder="Поиск по виду топлива" aria-label="Поиск по виду топлива">
  <label class="d-flex align-items-center gap-2 mb-2">
    <input type="checkbox" data-fuel-all checked> Выбрать все
  </label>
  <div class="ot-territory-filter-values d-flex flex-column gap-2 mb-3" data-fuel-values></div>
  <div class="d-flex justify-content-between gap-2">
    <button type="button" class="btn btn-sm btn-outline-secondary" data-fuel-reset>Сбросить</button>
    <button type="button" class="btn btn-sm btn-primary" data-fuel-apply>Применить</button>
  </div>
</div>
