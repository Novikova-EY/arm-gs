{% set sheet_slug = sheet.slug %} {% macro cmp_url(s_slug) -%} {{
url_for('ecology_bp.gis_tes_fuel_comparison', sheet_slug=s_slug,
**(keep_query_with_view|default({}))) }} {%- endmacro %}
<div class="d-flex align-items-center gap-2 w-100 pb-1">
  <div
    class="d-flex flex-nowrap gap-2 overflow-auto flex-grow-1"
    style="min-width: 0"
    role="navigation"
    aria-label="Листы сопоставления"
  >
    <div
      class="btn-group flex-shrink-0"
      role="group"
      aria-label="Состав данных"
    >
      {% for nav in comparison_sheets %}
      <a
        href="{{ cmp_url(nav.slug) }}"
        class="btn fs-5 text-nowrap {% if nav.slug == sheet_slug %}btn-primary{% else %}btn-outline-secondary{% endif %}"
      >
        {{ nav.nav_label }}
      </a>
      {% endfor %}
    </div>
  </div>
  <a
    href="{{ url_for('ecology_bp.hub') }}"
    class="btn btn-secondary fs-5 text-nowrap flex-shrink-0"
    >Модуль «Экология»</a
  >
</div>
