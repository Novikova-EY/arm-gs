<script>
document.addEventListener("DOMContentLoaded", function () {
    // Пока блок раскрыт, его кнопка-переключатель подсвечивается синим.
    function highlightButton(buttonEl) {
        if (!buttonEl) return;
        buttonEl.classList.remove("btn-outline-secondary");
        buttonEl.classList.add("btn-primary", "text-white");
    }

    function resetButton(buttonEl) {
        if (!buttonEl) return;
        buttonEl.classList.remove("btn-primary", "btn-warning", "text-white");
        buttonEl.classList.add("btn-outline-secondary");
    }

    function bindCollapseHighlight(collapseId, buttonId) {
        const collapseEl = document.getElementById(collapseId);
        const buttonEl = document.getElementById(buttonId);
        if (!collapseEl || !buttonEl) return collapseEl;
        if (collapseEl.classList.contains("show")) {
            highlightButton(buttonEl);
        } else {
            resetButton(buttonEl);
        }
        collapseEl.addEventListener("shown.bs.collapse", function () {
            highlightButton(buttonEl);
        });
        collapseEl.addEventListener("hide.bs.collapse", function () {
            resetButton(buttonEl);
        });
        return collapseEl;
    }

    function initFilters() {
        if (typeof initializeStationFilters === "function") {
            initializeStationFilters();
        }
    }

    const collapseEl = bindCollapseHighlight("filtersCollapse", "filtersToggleBtn");
    bindCollapseHighlight("importExportCollapse", "importExportToggleBtn");

    if (collapseEl && collapseEl.classList.contains("show")) {
        initFilters();
    }

    if (!collapseEl) return;
    collapseEl.addEventListener("shown.bs.collapse", initFilters);
});
</script>
