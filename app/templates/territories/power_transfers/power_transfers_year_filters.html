<!-- Выбор периода лет (как на station_list) -->
<form method="GET"
      action="{{ url_for('territories_bp.power_transfers') }}"
      class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3 w-100"
      id="yearForm">
    <input type="hidden" name="page" value="1">
    <input type="hidden" name="sort_by" value="{{ sort_by }}">
    <input type="hidden" name="sort_dir" value="{{ sort_dir }}">
    <input type="hidden" name="power_transfer_filter" value="{{ power_transfer_filter }}">

    <div class="d-flex align-items-center gap-2 flex-wrap">
        <label for="start_year" class="mb-0" style="white-space: nowrap;">Год начала:</label>
        <select name="start_year" id="start_year" class="form-select" style="width: 120px;">
            {% for year in filter_year_list %}
            <option value="{{ year }}" {% if start_year == year %}selected{% endif %}>{{ year }}</option>
            {% endfor %}
        </select>

        <label for="end_year" class="mb-0" style="white-space: nowrap;">Год конца:</label>
        <select name="end_year" id="end_year" class="form-select" style="width: 120px;">
            {% for year in filter_year_list %}
            <option value="{{ year }}" {% if end_year == year %}selected{% endif %}>{{ year }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-outline-success">Применить</button>

        <a href="{{ url_for('territories_bp.power_transfers',
                            page=1,
                            per_page=per_page,
                            sort_by=sort_by,
                            sort_dir=sort_dir,
                            power_transfer_filter=power_transfer_filter) }}"
           class="btn btn-outline-danger"
           data-no-preloader>
            Сбросить
        </a>
    </div>

    <select name="per_page"
            class="form-select d-inline-block w-auto flex-shrink-0"
            onchange="this.form.page.value=1; this.form.submit()">
        <option value="5"  {% if per_page|int == 5 %}selected{% endif %}>5 строк</option>
        <option value="10" {% if per_page|int == 10 %}selected{% endif %}>10 строк</option>
        <option value="25" {% if per_page|int == 25 %}selected{% endif %}>25 строк</option>
        <option value="50" {% if per_page|int == 50 %}selected{% endif %}>50 строк</option>
    </select>
</form>
