{# Редактируемая строка контрольных значений выработки по РЭС #}
<tr class="ee-control-row table-secondary text-center align-middle" style="font-weight: bold;"
    data-res-id="{{ res_id }}">
    <td></td>
    <td class="text-start">
        {{ label }}{% if info_tooltip %}
        <i class="bi bi-info-circle text-primary ms-1 ee-total-tip"
           data-bs-toggle="tooltip"
           data-bs-placement="top"
           title="{{ info_tooltip|e }}"
           style="cursor: help; font-size: 0.9em; vertical-align: -0.1em;"
           aria-label="Логика контрольных значений"></i>{% endif %}
    </td>
    <td colspan="6"></td>
    {% for period_num, period_label in period_columns %}
    {% set control_value = period_totals.get(period_num) %}
    <td class="ee-control-cell p-1"
        data-res-id="{{ res_id }}"
        data-period="{{ period_num }}">
        <input type="text"
               class="form-control form-control-sm text-center ee-control-value"
               data-res-id="{{ res_id }}"
               data-period="{{ period_num }}"
               value="{{ format_generation_input_value(control_value, rounding_digits) }}"
               inputmode="decimal"
               aria-label="Контрольное значение за {{ period_label }}">
    </td>
    {% endfor %}
</tr>
