{# Строка итога по уровню иерархии #}
<tr class="{{ row_class|default('table-info') }} text-center align-middle" style="font-weight: bold;">
    <td></td>
    <td class="text-start">
        {{ label }}{% if info_tooltip %}
        <i class="bi bi-info-circle text-primary ms-1 ee-total-tip"
           data-bs-toggle="tooltip"
           data-bs-placement="top"
           title="{{ info_tooltip|e }}"
           style="cursor: help; font-size: 0.9em; vertical-align: -0.1em;"
           aria-label="Логика расчёта итога"></i>{% endif %}
    </td>
    <td colspan="6"></td>
    {% for period_num, period_label in period_columns %}
    <td>{{ format_generation_cell(period_totals.get(period_num)) }}</td>
    {% endfor %}
</tr>
