{% if row.machine_id and row.station_id %}
<a href="{{ url_for('station_bp.machine_details', station_id=row.station_id, machine_id=row.machine_id, **request.args) }}" class="text-decoration-none">{{ row.label }}</a>
{% elif row.station_id %}
<a href="{{ url_for('station_bp.station_details', station_id=row.station_id, **request.args) }}" class="text-decoration-none">{{ row.label }}</a>
{% else %}
{{ row.label }}
{% endif %}
