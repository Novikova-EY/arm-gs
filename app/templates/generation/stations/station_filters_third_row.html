<!-- Третья строка фильтров -->
<div class="col-12 mb-2">
    <div class="d-flex justify-content-between align-items-center w-100 flex-wrap gap-3 mb-2">

        <!-- Левая часть: выбор годов -->
        <div class="d-flex align-items-center gap-2">
            <form method="GET" action="{{ url_for(station_list_endpoint | default('station_bp.station_list')) }}" class="d-flex align-items-center gap-2" id="yearForm">
                {% for key, value in request.args.items() %}
                    {% if key != "per_page" and key != "start_year" and key != "end_year" %}
                        <input type="hidden" name="{{ key }}" value="{{ value }}">
                    {% endif %}
                {% endfor %}

                <label for="start_year" class="mb-0" style="white-space: nowrap;">Год начала:</label>
                <select name="start_year" id="start_year" class="form-select" onchange="updateHiddenFields()">
                    {% for year in (filter_year_list|default([])) %}
                    <option value="{{ year }}" {% if start_year == year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>

                <label for="end_year" class="mb-0" style="white-space: nowrap;">Год конца:</label>
                <select name="end_year" id="end_year" class="form-select" onchange="updateHiddenFields()">
                    {% for year in (filter_year_list|default([])) %}
                    <option value="{{ year }}" {% if end_year == year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="btn btn-outline-success">Применить</button>

                <a href="{{ url_for(station_list_endpoint | default('station_bp.station_list'), reset_filters=1) }}" class="btn btn-outline-danger">Сбросить</a>
            </form>
        </div>

        <!-- Пагинация -->
        <div class="flex-grow-1 d-flex justify-content-center align-items-center" style="min-width: 200px;">
            {% if per_page is not none %}
                {% include 'generation/includes/pagination_station.html' %}
            {% endif %}
        </div>

        <!-- Правая часть: чекбоксы, округление, пер-пейдж -->
        <div class="d-flex align-items-center flex-wrap justify-content-end gap-5">

            <!-- Итоги + выбор количества строк -->
            <form id="perPageForm" method="GET" action="{{ url_for(station_list_endpoint | default('station_bp.station_list')) }}">
                <!-- Горизонтальное размещение блоков -->
                <div class="d-flex align-items-center flex-wrap gap-4">
                    <!-- Проверка топлива -->
                    <div class="d-flex align-items-center gap-2">
                        <input type="checkbox" class="btn-check" id="fuel_check_switch" autocomplete="off"
                            {% if request.args.get('fuel_check') == '1' %}checked{% endif %}>
                        <label for="fuel_check_switch"
                            class="btn {% if request.args.get('fuel_check') == '1' %}btn-warning{% else %}btn-outline-secondary text-dark{% endif %} px-3 text-center"
                            style="min-width: 260px;">
                            Проверка топлива
                        </label>
                    </div>

                    <!-- Переключатель отображения сумм -->
                    <div class="d-flex align-items-center gap-2">
                        <input type="checkbox" class="btn-check" id="show_totals_switch" autocomplete="off"
                            {% if request.args.get('show_totals') == '1' %}checked{% endif %}>
                        <label for="show_totals_switch"
                            class="btn {% if request.args.get('show_totals') == '1' %}btn-primary{% else %}btn-outline-secondary text-dark{% endif %} px-3 text-center"
                            style="min-width: 260px;">
                            Показать суммы по регионам
                        </label>
                    </div>

                    <!-- Переключатель отображения агрегатов -->
                    <div class="d-flex align-items-center gap-2">
                        <input type="checkbox" class="btn-check" id="hide_aggregates_switch" autocomplete="off">
                        <label for="hide_aggregates_switch"
                            class="btn btn-outline-secondary text-dark px-3 text-center"
                            style="min-width: 260px;">
                            Скрыть агрегаты
                        </label>
                    </div>

                    <!-- Выпадающий список -->
                    <div id="per_page_select_block" class="ms-2">
                        <div class="d-flex align-items-center gap-2" id="per_page_select_wrapper">
                            <label for="per_page_select" class="mb-0" style="white-space: nowrap; min-width: 100px;">Показать:</label>
                            <select id="per_page_select" class="form-select" style="min-width: 150px;">
                                <option value="10" {% if request.args.get('per_page') == '10' %}selected{% endif %}>10 станций</option>
                                <option value="25" {% if request.args.get('per_page') == '25' %}selected{% endif %}>25 станций</option>
                                <option value="50" {% if request.args.get('per_page') == '50' %}selected{% endif %}>50 станций</option>
                                <option value="50" {% if request.args.get('per_page') == '100' %}selected{% endif %}>100 станций</option>
                                <option value="all" {% if request.args.get('per_page') == 'all' %}selected{% endif %}>Все электростанции</option>
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
