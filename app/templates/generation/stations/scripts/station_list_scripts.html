<!-- Скрипт подключения при раскрытии блока с фильтрами-->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const collapseEl = document.getElementById("filtersCollapse");
    const buttonEl = document.getElementById("filtersToggleBtn");

    if (!collapseEl || !buttonEl) return;

    const hasActiveFilters = JSON.parse(`{{ has_active_filters | tojson }}`);

    function highlightButton() {
        buttonEl.classList.remove("btn-outline-secondary");
        buttonEl.classList.add("btn-primary", "text-white");
    }

    function resetButton() {
        buttonEl.classList.remove("btn-primary", "text-white");
        buttonEl.classList.add("btn-outline-secondary");
    }

    function loadFiltersScript() {
        if (window.stationFiltersInitialized) return;
        const script = document.createElement("script");
        script.src = "{{ url_for('static', filename='js/generation/stations/station_filters_first_row.js') }}";
        script.onload = () => {
            if (typeof initializeStationFilters === "function") {
                initializeStationFilters();
            }
        };
        document.head.appendChild(script);
    }

    const collapse = new bootstrap.Collapse(collapseEl, {
        toggle: false
    });

    // 🔹 Блок фильтров открыт по умолчанию — подсвечиваем и подгружаем скрипт
    if (collapseEl.classList.contains("show")) {
        collapse.show();
        highlightButton();
        loadFiltersScript();
    }

    // 🔹 При ручном открытии — подсветка и подгрузка
    collapseEl.addEventListener("show.bs.collapse", () => {
        highlightButton();
        loadFiltersScript();
    });

    // 🔹 При закрытии — убираем подсветку
    collapseEl.addEventListener("hide.bs.collapse", () => {
        resetButton();
    });
});
</script>

<!-- Скрипт для поиска по фильтрам в шапке таблицы -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Фильтры, которые должны применяться сразу при клике по чекбоксу
        const instantFilters = [
            "station_type_filter",
            "tes_type_filter",
            "tes_machine_type_filter",
            "fuel_type_filter",
            "relabing_outcome_filter",
        ];

        // Найдем все чекбоксы в выпадающих фильтрах и повесим обработчик
        document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(input => {
            if (instantFilters.includes(input.name)) {
                input.addEventListener('change', updateFilters);
            }
        });

        function updateFilters() {
            let form = document.createElement("form");
            form.method = "GET";
            form.action = "{{ url_for(station_list_endpoint | default('station_bp.station_list')) }}";

            // Список параметров, которые НЕ нужно добавлять
            let excludeKeys = ["station_type_filter", "tes_type_filter", "tes_machine_type_filter", "relabing_outcome_filter"];

            // Jinja2 передает параметры в JSON-объекте
            let params = JSON.parse('{{ request.args.to_dict() | tojson | safe }}');

            // Добавляем другие параметры запроса (кроме исключенных)
            for (let key in params) {
                if (!excludeKeys.includes(key)) {
                    let input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = params[key];
                    form.appendChild(input);
                }
            }

            // Добавление выбранных значений в форму (только для моментальных фильтров)
            document.querySelectorAll('.dropdown-menu input[type="checkbox"]:checked').forEach(checkbox => {
                if (!instantFilters.includes(checkbox.name)) {
                    return;
                }
                let input = document.createElement("input");
                input.type = "hidden";
                input.name = checkbox.name;
                input.value = checkbox.value;
                form.appendChild(input);
            });

            document.body.appendChild(form);
            form.submit();
        }
    });
</script>

<!-- Скрипт для сброса предыдущих значений при поиске по фильтрам в шапке таблицы -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Те же моментальные фильтры, что и выше
        const instantFilters = [
            "station_type_filter",
            "tes_type_filter",
            "tes_machine_type_filter",
            "fuel_type_filter",
            "relabing_outcome_filter",
        ];

        // Для моментальных фильтров обновляем URL сразу при изменении чекбокса
        document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(input => {
            if (instantFilters.includes(input.name)) {
                input.addEventListener('change', function() {
                    let params = new URLSearchParams(window.location.search);
                    let filterName = this.name;

                    // 🔹 Удаляем ВСЕ старые значения этого фильтра
                    params.delete(filterName);

                    // 🔹 Добавляем в URL только отмеченные чекбоксы
                    document.querySelectorAll(`input[name="${filterName}"]:checked`).forEach(cb => {
                        params.append(filterName, cb.value);
                    });

                    params.set('page', '1');

                    // 🔹 Перенаправляем на новый URL (без дубликатов)
                    window.location.href = window.location.pathname + "?" + params.toString();
                });
            }
        });

        // Для годовых фильтров (ввод/вывод/модерн.) применяем значения только по кнопке "Ок"
        document.querySelectorAll('.filter-apply-btn').forEach(button => {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const filterName = this.getAttribute('data-filter-name');
                if (!filterName) {
                    return;
                }

                // Текущие параметры URL
                const params = new URLSearchParams(window.location.search);

                // Удаляем все старые значения этого фильтра
                params.delete(filterName);

                // Добавляем только отмеченные значения соответствующего фильтра
                document.querySelectorAll(`input[name="${filterName}"]:checked`).forEach(cb => {
                    params.append(filterName, cb.value);
                });

                // При изменении фильтра возвращаемся на первую страницу
                params.set('page', '1');

                // Переход по новому URL
                const newUrl = window.location.pathname + "?" + params.toString();
                window.location.href = newUrl;
            });
        });

        // Кнопка "Сбросить" внутри выпадающего списка — просто снимает галочки, без перезагрузки
        document.querySelectorAll('.filter-reset-btn').forEach(button => {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const filterName = this.getAttribute('data-filter-name');
                if (!filterName) {
                    return;
                }

                // Снимаем все галочки только у соответствующего фильтра
                document.querySelectorAll(`input[name="${filterName}"]`).forEach(cb => {
                    cb.checked = false;
                });
            });
        });
    });
</script>

<!-- Скрипт для переключения между режимами "все электростанции" и "постранично" -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const checkbox = document.getElementById("per_page_switch");
    const selectBlock = document.getElementById("per_page_select_block"); // оборачивающий div или сам select

    function updateVisibility() {
        const params = new URLSearchParams(window.location.search);
        if (checkbox.checked) {
            params.set("per_page", "all");
            if (selectBlock) selectBlock.classList.add("d-none");
        } else {
            params.set("per_page", "10"); // или значение по умолчанию
            if (selectBlock) selectBlock.classList.remove("d-none");
        }
        window.location.href = window.location.pathname + "?" + params.toString();
    }

    if (checkbox) {
        checkbox.addEventListener("change", updateVisibility);

        // При загрузке страницы сразу скрываем/показываем, если нужно
        if (selectBlock) {
            if (checkbox.checked) {
                selectBlock.classList.add("d-none");
            } else {
                selectBlock.classList.remove("d-none");
            }
        }
    }
});
</script>
